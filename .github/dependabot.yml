version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 10
    ignore:
      #xunit.v3 majors are migrations, not bumps: 3.x to 4.0 forced Microsoft.Testing.Platform,
      #OutputType Exe and four package swaps. Minors and patches flow normally.
      - dependency-name: xunit.*
        update-types: ["version-update:semver-major"]
    # - dependency-name: Serilog.AspNetCore
    # - dependency-name: Serilog.Enrichers.Environment

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
    ignore:
      # Dockerfile.whisper-cpp builds on the Ubuntu release of the upstream whisper.cpp Vulkan
      # runtime image; a newer major links glibc and Vulkan libraries the runtime lacks.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: helm
    directory: /charts/smarthaus
    schedule:
      interval: weekly
      time: "04:00"
