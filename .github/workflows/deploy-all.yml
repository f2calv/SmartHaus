name: deploy-all

on:
  workflow_dispatch:
    inputs:
      cascap-common-ref:
        type: string
        description: Branch/tag CasCap.Common (empty=Release build)
        default:
      cascap-api-azure-ref:
        type: string
        description: Branch/tag CasCap.Api.Azure (empty=Release build)
        default:
      cascap-api-voice-ref:
        type: string
        description: Branch/tag CasCap.Api.Voice (empty=Release build)
        default:
      signalizr-ref:
        type: string
        description: Branch/tag signalizr (empty=Release build)
        default:
      push-nuget:
        type: boolean
        description: Push NuGet packages?
        default: false
      #Run from the default branch; only the packages from this existing release are published.
      nuget-release:
        type: string
        description: NuGet-only recovery release e.g. 1.2.3
        default: ''

permissions: {}

#A deployment must finish: a second dispatch for the same ref queues behind it rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    if: inputs.nuget-release == ''
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false

  #Resolves the Debug/Release choice and the extra-repos JSON once from the dependency ref inputs.
  #Any ref switches the build to the Debug solution, which references sibling source projects.
  settings:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      configuration: ${{ steps.settings.outputs.configuration }}
      solution: ${{ steps.settings.outputs.solution }}
      dockerfile: ${{ steps.settings.outputs.dockerfile }}
      build-args: ${{ steps.settings.outputs.build-args }}
      build-repos: ${{ steps.settings.outputs.build-repos }}
      image-repos: ${{ steps.settings.outputs.image-repos }}
    steps:
      - name: resolve build settings
        id: settings
        env:
          CASCAP_COMMON_REF: ${{ inputs.cascap-common-ref }}
          CASCAP_API_AZURE_REF: ${{ inputs.cascap-api-azure-ref }}
          CASCAP_API_VOICE_REF: ${{ inputs.cascap-api-voice-ref }}
          SIGNALIZR_REF: ${{ inputs.signalizr-ref }}
        run: |
          set -euo pipefail
          REPOS=$(jq -nc \
            --arg common "$CASCAP_COMMON_REF" --arg azure "$CASCAP_API_AZURE_REF" --arg voice "$CASCAP_API_VOICE_REF" --arg signalizr "$SIGNALIZR_REF" \
            '[{name: "CasCap.Common", ref: $common}, {name: "CasCap.Api.Azure", ref: $azure}, {name: "CasCap.Api.Voice", ref: $voice}, {name: "signalizr", ref: $signalizr}]
             | map(select(.ref != "") | {repo: ("f2calv/" + .name), ref, name})')
          if [[ "$(jq length <<< "$REPOS")" -gt 0 ]]; then
            CONFIGURATION=Debug; SOLUTION=SmartHaus.Debug.slnx; DOCKERFILE=Dockerfile.Debug
            BUILD_ARGS="--build-arg WORKLOAD=CasCap.App.Server --build-arg CONFIGURATION=Debug"
          else
            CONFIGURATION=Release; SOLUTION=SmartHaus.Release.slnx; DOCKERFILE=Dockerfile
            BUILD_ARGS="--build-arg WORKLOAD=CasCap.App.Server"
          fi
          {
            echo "configuration=$CONFIGURATION"
            echo "solution=$SOLUTION"
            echo "dockerfile=$DOCKERFILE"
            echo "build-args=$BUILD_ARGS"
            echo "build-repos=$(jq -c 'map({repo, ref, path: ("../" + .name)})' <<< "$REPOS")"
            echo "image-repos=$(jq -c 'map({repo, ref, path: ("deps/" + .name)})' <<< "$REPOS")"
          } | tee -a "$GITHUB_OUTPUT"
  build:
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    permissions:
      contents: read
    needs: [settings, versioning]
    with:
      version: ${{ needs.versioning.outputs.version }}
      configuration: ${{ needs.settings.outputs.configuration }}
      solution-name: ${{ needs.settings.outputs.solution }}
      #Match ci.yml: integration tests need the edge-sp certificate and devices, which the runner does not have.
      dotnet-test-args: '["--filter-not-trait", "Category=Integration", "--ignore-exit-code", "8"]'
      extra-repos: ${{ needs.settings.outputs.build-repos }}

  nuget:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write #nuget.org trusted publishing exchanges this for a short-lived api key
      packages: write
      contents: read
    needs: [versioning, build]
    if: ${{ !cancelled() && (inputs.nuget-release != '' || (inputs.push-nuget && needs.versioning.result == 'success' && needs.build.result == 'success')) }}
    steps:
      - name: validate NuGet publication
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.nuget-release }}
          CALCULATED_VERSION: ${{ needs.versioning.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Stable NuGet publication must run from the default branch. Use nuget-release to recover an existing release."
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::nuget-release must be a clean X.Y.Z release version."
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" |
              jq -e --arg version "$RELEASE_VERSION" '.tag_name == $version and .draft == false and .prerelease == false' > /dev/null
          fi
          echo "version=${RELEASE_VERSION:-$CALCULATED_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.nuget-release || github.sha }}

      - name: git rev-parse HEAD
        id: source
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          checkout: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          nuget-user: ${{ github.repository_owner }}
          version: ${{ steps.publication.outputs.version }}
          execute-tests: false
          solution-name: SmartHaus.Release.slnx
          #The action otherwise records the workflow commit rather than the checked-out release.
          dotnet-build-args: -p:SourceRevisionId=${{ steps.source.outputs.sha }}

  containerize:
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    permissions:
      packages: write #for pushing container image
      contents: read #note: for private repos setting packages to write, will reset all other permissions to none (weird?)
    needs: [settings, versioning]
    if: inputs.nuget-release == '' && github.event_name != 'pull_request'
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      dockerfile: ${{ needs.settings.outputs.dockerfile }}
      args: ${{ needs.settings.outputs.build-args }}
      push-image: ${{ github.actor != 'copilot[bot]' }}
      extra-repos: ${{ needs.settings.outputs.image-repos }}

  pkg-chart-smarthaus:
    uses: f2calv/gha-workflows/.github/workflows/helm-chart-package.yml@v1
    permissions:
      packages: write #for pushing helm artifact
      contents: read #note: for private repos setting packages to write, will reset all other permissions to none (weird?)
    needs: [versioning, build, containerize]
    if: inputs.nuget-release == '' && github.event_name != 'pull_request' && github.actor != 'copilot[bot]'
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io
      image-repository: ${{ github.repository_owner }}/smarthaus
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      chart-repository: ${{ github.repository_owner }}/charts/smarthaus
      chart-path: charts/smarthaus
      chart-testing-cli-command: skip #because helm charts not completed

  release:
    needs: [versioning, build, containerize, pkg-chart-smarthaus]
    if: inputs.nuget-release == ''
      && needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      tag-prefix: ''
      move-major-tag: false
