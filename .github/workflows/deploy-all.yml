name: deploy-all

on:
  workflow_dispatch:
    inputs:
      cascap-common-ref:
        type: string
        description: Branch/tag CasCap.Common (empty=Release build)
        default:
      cascap-api-azure-ref:
        type: string
        description: Branch/tag CasCap.Api.Azure (empty=Release build)
        default:
      cascap-api-voice-ref:
        type: string
        description: Branch/tag CasCap.Api.Voice (empty=Release build)
        default:
      signalizr-ref:
        type: string
        description: Branch/tag signalizr (empty=Release build)
        default:
      push-nuget:
        type: boolean
        description: Push NuGet packages?
        default: false
      #Run from the default branch; only the packages from this existing release are published.
      nuget-release:
        type: string
        description: NuGet-only recovery release e.g. 1.2.3
        default: ''

jobs:
  lint:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    if: inputs.nuget-release == ''
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    needs: versioning
    with:
      version: ${{ needs.versioning.outputs.version }}
      configuration: ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '' || inputs.cascap-api-voice-ref != '' || inputs.signalizr-ref != '') && 'Debug' || 'Release' }}
      solution-name: ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '' || inputs.cascap-api-voice-ref != '' || inputs.signalizr-ref != '') && 'SmartHaus.Debug.slnx' || 'SmartHaus.Release.slnx' }}
      #Match ci.yml: integration tests need the edge-sp certificate and devices, which the runner does not have.
      dotnet-test-args: '["--filter-not-trait", "Category=Integration", "--ignore-exit-code", "8"]'
      extra-repos: |
        [
          ${{ inputs.cascap-common-ref != '' && format('{{"repo":"f2calv/CasCap.Common","ref":"{0}","path":"../CasCap.Common"}}', inputs.cascap-common-ref) || '' }}
          ${{ inputs.cascap-common-ref != '' && inputs.cascap-api-azure-ref != '' && ',' || '' }}
          ${{ inputs.cascap-api-azure-ref != '' && format('{{"repo":"f2calv/CasCap.Api.Azure","ref":"{0}","path":"../CasCap.Api.Azure"}}', inputs.cascap-api-azure-ref) || '' }}
          ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '') && inputs.cascap-api-voice-ref != '' && ',' || '' }}
          ${{ inputs.cascap-api-voice-ref != '' && format('{{"repo":"f2calv/CasCap.Api.Voice","ref":"{0}","path":"../CasCap.Api.Voice"}}', inputs.cascap-api-voice-ref) || '' }}
          ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '' || inputs.cascap-api-voice-ref != '') && inputs.signalizr-ref != '' && ',' || '' }}
          ${{ inputs.signalizr-ref != '' && format('{{"repo":"f2calv/signalizr","ref":"{0}","path":"../signalizr"}}', inputs.signalizr-ref) || '' }}
        ]

  nuget:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write #nuget.org trusted publishing exchanges this for a short-lived api key
      packages: write
      contents: read
    needs: [versioning, build]
    if: ${{ !cancelled() && (inputs.nuget-release != '' || (inputs.push-nuget && needs.versioning.result == 'success' && needs.build.result == 'success')) }}
    steps:
      - name: validate NuGet publication
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.nuget-release }}
          CALCULATED_VERSION: ${{ needs.versioning.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Stable NuGet publication must run from the default branch. Use nuget-release to recover an existing release."
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::nuget-release must be a clean X.Y.Z release version."
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" |
              jq -e --arg version "$RELEASE_VERSION" '.tag_name == $version and .draft == false and .prerelease == false' > /dev/null
          fi
          echo "version=${RELEASE_VERSION:-$CALCULATED_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.nuget-release || github.sha }}

      - name: git rev-parse HEAD
        id: source
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          checkout: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          nuget-user: ${{ github.repository_owner }}
          version: ${{ steps.publication.outputs.version }}
          execute-tests: false
          solution-name: SmartHaus.Release.slnx
          #The action otherwise records the workflow commit rather than the checked-out release.
          dotnet-build-args: -p:SourceRevisionId=${{ steps.source.outputs.sha }}

  containerize:
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    permissions:
      packages: write #for pushing container image
      contents: read #note: for private repos setting packages to write, will reset all other permissions to none (weird?)
    needs: [versioning]
    if: inputs.nuget-release == '' && github.event_name != 'pull_request'
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      dockerfile: ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '' || inputs.cascap-api-voice-ref != '' || inputs.signalizr-ref != '') && 'Dockerfile.Debug' || 'Dockerfile' }}
      args: --build-arg WORKLOAD=CasCap.App.Server ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '' || inputs.cascap-api-voice-ref != '' || inputs.signalizr-ref != '') && '--build-arg CONFIGURATION=Debug' || '' }}
      push-image: ${{ github.actor != 'copilot[bot]' }}
      extra-repos: |
        [
          ${{ inputs.cascap-common-ref != '' && format('{{"repo":"f2calv/CasCap.Common","ref":"{0}","path":"deps/CasCap.Common"}}', inputs.cascap-common-ref) || '' }}
          ${{ inputs.cascap-common-ref != '' && inputs.cascap-api-azure-ref != '' && ',' || '' }}
          ${{ inputs.cascap-api-azure-ref != '' && format('{{"repo":"f2calv/CasCap.Api.Azure","ref":"{0}","path":"deps/CasCap.Api.Azure"}}', inputs.cascap-api-azure-ref) || '' }}
          ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '') && inputs.cascap-api-voice-ref != '' && ',' || '' }}
          ${{ inputs.cascap-api-voice-ref != '' && format('{{"repo":"f2calv/CasCap.Api.Voice","ref":"{0}","path":"deps/CasCap.Api.Voice"}}', inputs.cascap-api-voice-ref) || '' }}
          ${{ (inputs.cascap-common-ref != '' || inputs.cascap-api-azure-ref != '' || inputs.cascap-api-voice-ref != '') && inputs.signalizr-ref != '' && ',' || '' }}
          ${{ inputs.signalizr-ref != '' && format('{{"repo":"f2calv/signalizr","ref":"{0}","path":"deps/signalizr"}}', inputs.signalizr-ref) || '' }}
        ]

  pkg-chart-smarthaus:
    uses: f2calv/gha-workflows/.github/workflows/helm-chart-package.yml@v1
    permissions:
      packages: write #for pushing helm artifact
      contents: read #note: for private repos setting packages to write, will reset all other permissions to none (weird?)
    needs: [versioning, build, containerize]
    if: inputs.nuget-release == '' && github.event_name != 'pull_request' && github.actor != 'copilot[bot]'
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io
      image-repository: ${{ github.repository_owner }}/smarthaus
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      #chart-registry-password: ${{ secrets.GITHUB_TOKEN }} #Note: this doesnt work
      chart-repository: ${{ github.repository_owner }}/charts/smarthaus
      chart-path: charts/smarthaus
      chart-testing-cli-command: skip #because helm charts not completed
    secrets: inherit

  release:
    needs: [versioning, build, containerize, pkg-chart-smarthaus]
    if: inputs.nuget-release == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
