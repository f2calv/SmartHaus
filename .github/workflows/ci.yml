name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all permissions at workflow level; jobs grant only what they need.
permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    needs: [versioning]
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: SmartHaus.Release.slnx
      dotnet-test-args: '["--filter-not-trait", "Category=Integration", "--ignore-exit-code", "8"]'

  release:
    needs: [lint, versioning, build]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: write
