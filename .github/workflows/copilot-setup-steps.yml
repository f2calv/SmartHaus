name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout SmartHaus
        uses: actions/checkout@v7

      - name: git clone f2calv/CasCap.Common
        run: git clone --depth 1 https://github.com/f2calv/CasCap.Common.git $GITHUB_WORKSPACE/../CasCap.Common

      - name: git clone f2calv/CasCap.Api.Azure
        run: git clone --depth 1 https://github.com/f2calv/CasCap.Api.Azure.git $GITHUB_WORKSPACE/../CasCap.Api.Azure

      - name: git clone f2calv/CasCap.Api.SignalCli
        run: git clone --depth 1 https://github.com/f2calv/CasCap.Api.SignalCli.git $GITHUB_WORKSPACE/../CasCap.Api.SignalCli

      - name: git clone f2calv/CasCap.Api.Voice
        run: git clone --depth 1 https://github.com/f2calv/CasCap.Api.Voice.git $GITHUB_WORKSPACE/../CasCap.Api.Voice

      - name: git clone f2calv/signalizr
        run: git clone --depth 1 https://github.com/f2calv/signalizr.git $GITHUB_WORKSPACE/../signalizr

      - name: dotnet restore SmartHaus.Debug.slnx
        run: dotnet restore SmartHaus.Debug.slnx

      - name: dotnet build SmartHaus.Debug.slnx
        run: dotnet build SmartHaus.Debug.slnx --no-restore
