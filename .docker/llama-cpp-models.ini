version = 1

; Laptop defaults for a 4 GB GPU. Only one model is resident at a time; the
; router evicts it when another configured model is requested.
[*]
n-gpu-layers = 999
cache-ram = 512
flash-attn = on
reasoning-budget = 0
batch-size = 1024
n-predict = 2048
ctx-size = 4096
cache-type-k = q8_0
cache-type-v = q8_0

; Text-first default: 2.93 GiB weights, no multimodal projector. Observed Q4
; usage was 2.9/4 GiB, so Q5 retains roughly 700 MiB for runtime buffers.
[unsloth/Qwen3.5-4B-GGUF:Q5_K_M]
hf-repo = unsloth/Qwen3.5-4B-GGUF:Q5_K_M
load-on-startup = true
no-mmproj = true

; Smaller multimodal companion loaded only when explicitly requested.
[unsloth/Qwen3.5-0.8B-GGUF:Q4_K_XL-VISION]
hf-repo = unsloth/Qwen3.5-0.8B-GGUF:UD-Q4_K_XL
load-on-startup = false
