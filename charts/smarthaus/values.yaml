# ── Shared defaults ──────────────────────────────────────────────────
# Each alias key maps to a dependency in Chart.yaml. Values here serve
# as defaults; deployment values provide all envVars and override
# only what differs per workload (extra volumes, etc.).
#
# Workloads with replicaCount: 0 are disabled by default and must be
# enabled explicitly in deployment values.
# ─────────────────────────────────────────────────────────────────────

image: &image
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.31.0"

_shared: &shared
  image: *image
  service:
    enabled: true
    name: http
    type: ClusterIP
    port: 80
    containerPort: 8080
    protocol: TCP
    annotations: {}
  envFieldRef:
    AppConfig__NodeName: spec.nodeName
    AppConfig__PodName: metadata.name
    AppConfig__Namespace: metadata.namespace
    AppConfig__PodIp: status.podIP
    AppConfig__ServiceAccountName: spec.serviceAccountName
  startupProbe:
    httpGet:
      path: /healthz/startup
      port: 8080
    periodSeconds: 10
    initialDelaySeconds: 20
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /healthz/ready
      port: 8080
    periodSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 10
  livenessProbe:
    httpGet:
      path: /healthz/live
      port: 8080
    periodSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Workload defaults ───────────────────────────────────────────────
# Image pull secrets, volumes, secrets, ingress and node placement are
# deployment-specific; the chart README shows examples of each.

doorbird:
  <<: *shared

buderus:
  <<: *shared

knx:
  <<: *shared

fronius:
  <<: *shared

edge-cpu:
  <<: *shared
  securityContext:
    privileged: true
  strategy:
    type: Recreate
  # One replica per node: each pod reports telemetry for the node it runs on.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge-cpu
          topologyKey: kubernetes.io/hostname

edge-gpu:
  <<: *shared
  runtimeClassName: nvidia
  securityContext:
    privileged: true

signalrhub:
  <<: *shared

comms:
  <<: *shared

wiz:
  <<: *shared

shelly:
  <<: *shared

ubiquiti:
  <<: *shared

sicce:
  <<: *shared

# ── Disabled by default

ffmpeg:
  replicaCount: 0
